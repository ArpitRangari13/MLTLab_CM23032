<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentiment Analysis Lab</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; padding: 40px; color: #333; }
        .card { max-width: 650px; margin: 20px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; margin-top: 0; }
        button { background: #3498db; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:disabled { background: #bdc3c7; cursor: not-allowed; }
        input { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .status-box { margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 4px; text-align: center; }
        #results-area { margin-top: 25px; border-top: 2px solid #eee; padding-top: 20px; display: none; }
        .meter-bg { background: #eee; width: 100%; height: 25px; border-radius: 15px; margin: 15px 0; overflow: hidden; }
        #meter-fill { height: 100%; width: 0%; transition: width 0.5s ease, background 0.5s; }
        .score-display { font-size: 24px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h1>Step 1: Train Classifier</h1>
    <p>Train the model on positive/negative sentences to build the vocabulary.</p>
    <button id="train-btn">Train Model (50 Epochs)</button>
    <div id="train-status" class="status-box" style="background: #ebf5fb; color: #2980b9;">Waiting to start...</div>
</div>

<div class="card">
    <h1>Step 2: Custom Testing</h1>
    <p>Enter a sentence to interpret its sentiment confidence score.</p>
    <input type="text" id="user-text" placeholder="e.g., The experience was wonderful!" disabled>
    <button id="predict-btn" disabled style="background: #27ae60;">Analyze Sentiment</button>

    <div id="results-area">
        <div class="score-display" id="final-label">---</div>
        <div class="meter-bg">
            <div id="meter-fill"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: bold;">
            <span>NEGATIVE (0.0)</span>
            <span id="numeric-score">Score: 0.50</span>
            <span>POSITIVE (1.0)</span>
        </div>
    </div>
</div>

<script>
    // --- Data & Preprocessing ---
    const rawData = [
        { s: "i love this product", l: 1 }, { s: "amazing and great", l: 1 },
        { s: "excellent happy work", l: 1 }, { s: "wonderful fantastic day", l: 1 },
        { s: "hate this so much", l: 0 }, { s: "terrible and bad", l: 0 },
        { s: "worst ever disappointed", l: 0 }, { s: "awful quality poor", l: 0 }
    ];

    const words = Array.from(new Set(rawData.flatMap(d => d.s.split(' '))));
    const vocab = Object.fromEntries(words.map((w, i) => [w, i + 1]));
    const vocabSize = words.length + 1;
    const maxLen = 4;

    function encode(text) {
        let tokens = text.toLowerCase().split(' ').map(w => vocab[w] || 0);
        return tokens.length < maxLen ? [...tokens, ...new Array(maxLen - tokens.length).fill(0)] : tokens.slice(0, maxLen);
    }

    // --- Model Architecture ---
    let model = tf.sequential();
    model.add(tf.layers.embedding({ inputDim: vocabSize, outputDim: 8, inputLength: maxLen }));
    model.add(tf.layers.flatten());
    model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
    model.compile({ optimizer: 'adam', loss: 'binaryCrossentropy', metrics: ['accuracy'] });

    // --- Training Logic ---
    const trainBtn = document.getElementById('train-btn');
    const trainStatus = document.getElementById('train-status');
    const userText = document.getElementById('user-text');
    const predictBtn = document.getElementById('predict-btn');

    trainBtn.onclick = async () => {
        trainBtn.disabled = true;
        trainStatus.innerText = "Training model... please wait.";
        
        const xs = tf.tensor2d(rawData.map(d => encode(d.s)));
        const ys = tf.tensor2d(rawData.map(d => [d.l]));

        await model.fit(xs, ys, { epochs: 50 });

        trainStatus.innerText = "Training Complete! Testing Enabled.";
        trainStatus.style.background = "#d4edda";
        trainStatus.style.color = "#155724";
        userText.disabled = false;
        predictBtn.disabled = false;
    };

    // --- Prediction Logic (Task 2) ---
    predictBtn.onclick = () => {
        const text = userText.value.trim();
        if (!text) return;

        const inputTensor = tf.tensor2d([encode(text)]);
        const prediction = model.predict(inputTensor);
        const score = prediction.dataSync()[0]; // The Confidence Score

        document.getElementById('results-area').style.display = "block";
        const meter = document.getElementById('meter-fill');
        const label = document.getElementById('final-label');
        
        // Interpreting the Score
        const isPos = score > 0.5;
        label.innerText = isPos ? "POSITIVE 😊" : "NEGATIVE 😞";
        label.style.color = isPos ? "#27ae60" : "#e74c3c";
        
        meter.style.width = (score * 100) + "%";
        meter.style.background = isPos ? "#27ae60" : "#e74c3c";
        document.getElementById('numeric-score').innerText = `Confidence: ${score.toFixed(4)}`;
    };
</script>

</body>
</html>
