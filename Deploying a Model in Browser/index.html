<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TFJS: Save & Reload Model</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; line-height: 1.6; }
        .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { padding: 10px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:disabled { background: #ccc; }
        #status { font-weight: bold; color: #28a745; }
        input[type="file"] { margin: 10px 0; }
    </style>
</head>
<body>

    <h1>Model Persistence Lab</h1>

    <div class="card">
        <h3>Step 1: Train & Save Model</h3>
        <p>This trains a model to multiply numbers by 2 ($y = 2x$).</p>
        <button id="train-btn" onclick="trainAndSave()">Train & Download Model</button>
        <p id="train-status"></p>
    </div>

    <div class="card">
        <h3>Step 2: Reload & Predict</h3>
        <p>Select <b>BOTH</b> the <code>model.json</code> and <code>model.weights.bin</code> files you just downloaded.</p>
        <input type="file" id="file-selector" multiple>
        <br>
        <button onclick="loadAndPredict()">Load Files & Predict 10 × 2</button>
        <h2 id="prediction-result"></h2>
    </div>

    <script>
        let model;

        // --- PART 1: TRAINING AND SAVING ---
        async function trainAndSave() {
            const btn = document.getElementById('train-btn');
            const status = document.getElementById('train-status');
            btn.disabled = true;
            status.innerText = "Training... please wait.";

            // Define a simple linear model
            model = tf.sequential();
            model.add(tf.layers.dense({units: 1, inputShape: [1]}));
            model.compile({loss: 'meanSquaredError', optimizer: 'sgd'});

            // Training data (x: 1,2,3,4 -> y: 2,4,6,8)
            const xs = tf.tensor2d([1, 2, 3, 4], [4, 1]);
            const ys = tf.tensor2d([2, 4, 6, 8], [4, 1]);

            await model.fit(xs, ys, {epochs: 50});
            
            status.innerText = "Training Complete! Downloading files...";
            
            // This triggers a browser download of model.json and model.weights.bin
            await model.save('downloads://my-model');
            
            btn.disabled = false;
        }

        // --- PART 2: LOADING AND PREDICTING ---
        async function loadAndPredict() {
            const fileInput = document.getElementById('file-selector');
            const resultDisplay = document.getElementById('prediction-result');

            if (fileInput.files.length < 2) {
                alert("Please select both the .json and .bin files!");
                return;
            }

            try {
                // Use tf.io.browserFiles to load from the user's file selection
                const loadedModel = await tf.loadLayersModel(tf.io.browserFiles(
                    [fileInput.files[0], fileInput.files[1]]
                ));

                // Predict for the number 10
                const input = tf.tensor2d([10], [1, 1]);
                const prediction = loadedModel.predict(input);
                const data = await prediction.data();
                
                resultDisplay.innerText = "Prediction for 10 is: " + Math.round(data[0]);
            } catch (err) {
                console.error(err);
                alert("Error loading model. Make sure you selected the correct files.");
            }
        }
    </script>
</body>
</html>
