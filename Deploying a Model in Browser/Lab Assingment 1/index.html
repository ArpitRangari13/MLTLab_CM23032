<!DOCTYPE html>
<html>
<head>
    <title>1. Save to LocalStorage</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
</head>
<body>
    <h2>Train & Save to LocalStorage</h2>
    <button onclick="run()">Train and Save</button>
    <p id="status"></p>

    <script>
        async function run() {
            const status = document.getElementById('status');
            status.innerText = "Training...";

            // Create a simple model: y = 3x + 1
            const model = tf.sequential();
            model.add(tf.layers.dense({units: 1, inputShape: [1]}));
            model.compile({loss: 'meanSquaredError', optimizer: 'sgd'});

            const xs = tf.tensor2d([1, 2, 3, 4], [4, 1]);
            const ys = tf.tensor2d([4, 7, 10, 13], [4, 1]);

            await model.fit(xs, ys, {epochs: 100});

            // Save to LocalStorage
            await model.save('localstorage://my-model-1');
            
            status.innerText = "Model Saved to LocalStorage successfully!";
            const pred = model.predict(tf.tensor2d([5], [1, 1]));
            console.log("Original Prediction for 5:", (await pred.data())[0]);
        }
    </script>
</body>
</html>
