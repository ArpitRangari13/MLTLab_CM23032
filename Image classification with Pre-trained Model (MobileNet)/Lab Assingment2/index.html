<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2: Multi-Image Classification</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.18.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; padding: 20px; color: #334155; }
        .header { text-align: center; margin-bottom: 30px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        #status { display: inline-block; padding: 8px 20px; border-radius: 20px; font-weight: bold; background: #fef08a; color: #854d0e; margin-bottom: 20px; transition: 0.3s; }
        .ready { background: #bbf7d0 !important; color: #166534 !important; }
        
        .upload-btn { background: #3b82f6; color: white; padding: 12px 30px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .upload-btn:hover { background: #2563eb; }
        .upload-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        
        /* Grid for multiple images */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        .card img { width: 100%; height: 220px; object-fit: cover; border-bottom: 1px solid #e2e8f0; }
        .card-content { padding: 15px; text-align: center; }
        .pred-top { font-size: 1.1em; font-weight: 800; color: #0f172a; text-transform: capitalize; margin-bottom: 5px; }
        .pred-conf { color: #059669; font-weight: bold; font-size: 0.9em; background: #d1fae5; display: inline-block; padding: 4px 10px; border-radius: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin-top: 0;">Task 2: Accuracy Testing (5+ Images)</h2>
        <div id="status">⏳ Loading AI Engine...</div>
        <br>
        <input type="file" id="file-input" accept="image/*" multiple style="display: none;">
        <button id="upload-btn" class="upload-btn" disabled>Select 5 Images at Once</button>
        <p style="font-size: 0.85em; color: #64748b; margin-top: 15px;">
            <strong>Pro-Tip:</strong> Hold `Ctrl` (or `Cmd` on Mac) while clicking files to select multiple physical objects (dogs, cars, mugs, etc.).
        </p>
    </div>

    <div class="grid" id="gallery">
        </div>

    <script>
        let model;
        const statusDiv = document.getElementById('status');
        const uploadBtn = document.getElementById('upload-btn');
        const fileInput = document.getElementById('file-input');
        const gallery = document.getElementById('gallery');

        // 1. Initialize the AI
        async function initAI() {
            try {
                model = await mobilenet.load({version: 2, alpha: 1.0});
                statusDiv.innerText = "✅ AI Ready for Testing!";
                statusDiv.classList.add('ready');
                uploadBtn.disabled = false;
            } catch (err) {
                statusDiv.innerText = "❌ Error Loading Model";
                console.error(err);
            }
        }

        // 2. Trigger File Input
        uploadBtn.onclick = () => fileInput.click();

        // 3. Process Multiple Files
        fileInput.onchange = async (e) => {
            const files = e.target.files;
            if (files.length === 0) return;
            
            gallery.innerHTML = ''; // Clear previous test
            statusDiv.innerText = `⏳ Analyzing ${files.length} images...`;
            statusDiv.classList.remove('ready');

            for (let file of files) {
                const reader = new FileReader();
                
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    
                    // Wait for each image to render before classifying
                    img.onload = async () => {
                        const preds = await model.classify(img);
                        
                        // Extract Top Prediction
                        const topGuess = preds[0].className.split(',')[0];
                        const confidence = (preds[0].probability * 100).toFixed(1);
                        
                        // Build Card UI
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.innerHTML = `
                            <img src="${img.src}" alt="test image">
                            <div class="card-content">
                                <div class="pred-top">${topGuess}</div>
                                <div class="pred-conf">${confidence}% Confidence</div>
                            </div>
                        `;
                        gallery.appendChild(card);
                    };
                };
                reader.readAsDataURL(file);
            }
            
            // Reset status
            setTimeout(() => {
                statusDiv.innerText = "✅ Batch Analysis Complete!";
                statusDiv.classList.add('ready');
            }, 1000);
        };

        initAI();
    </script>
</body>
</html>
